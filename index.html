const card = $("card");

function loadDeck(name, shuffle) {
  current = name;
  deck = SETS[name].slice();
  if (shuffle) for (let k = deck.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [deck[k], deck[j]] = [deck[j], deck[k]]; }
  i = 0;
  renderTabs();
  show();
}
function renderTabs() {
  const t = $("tabs"); t.innerHTML = "";
  [...Object.keys(RAW), ALL].forEach(n => {
    const b = document.createElement("button");
    b.textContent = n + " (" + SETS[n].length + ")";
    if (n === current) b.className = "on";
    b.onclick = () => loadDeck(n, false);
    t.appendChild(b);
  });
}
function show() {
  card.classList.remove("flip");
  const c = deck[i];
  $("fr").textContent = c.fr;
  $("nl").textContent = c.nl;
  $("ex").textContent = c.ex;
  $("count").textContent = (i + 1) + " / " + deck.length;
  const isMusic = current.startsWith("La musique");
  $("note").textContent = isMusic ? "Op deze pagina staan geen vertalingen en zinnen in het boek; de vertalingen zijn aangevuld." : "";
  // card height: take the taller side
  card.style.minHeight = "300px";
}
function flip() { card.classList.toggle("flip"); }
function go(d) { i = (i + d + deck.length) % deck.length; show(); }

card.onclick = flip;
$("flip").onclick = flip;
$("next").onclick = () => go(1);
$("prev").onclick = () => go(-1);
$("shuffle").onclick = () => loadDeck(current, true);
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === " " || e.key === "ArrowUp" || e.key === "ArrowDown") { e.preventDefault(); flip(); }
});
loadDeck(current, false);
</script>
</body>
</html>
